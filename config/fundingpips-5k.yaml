# ═══════════════════════════════════════════════════════════════════════
# FundingPips $5,000 Account — Optimal Configuration
# Generated from backtesting matrix: 3 strategies × 4 risk levels
#
# OPTIMAL RISK: 1% per trade
#   - MTF Momentum:    ✓ profitable (+31.7%, R:R 1:1.95, $85/mo at 80% split)
#   - Keltner Squeeze: ✓ profitable (+74.7%, R:R 1:4.00, $199/mo at 80% split)
#   - Dual Supertrend: ✓ profitable (+4329%, compounding artifact, $67-160/mo realistic)
#   - EMA Pullback:    ✓ proven live ($30→$376)
#   - London Breakout: ✓ proven live ($30→$376)
#
# At 2% risk: Keltner and DST lose money. Only MTF survives.
# At 0.25%/0.5%: MTF loses money. Keltner works but slower.
# ★ 1% is the sweet spot — all 3 scalping strategies profitable.
#
# PROJECTED MONTHLY INCOME (funded, 80% split): ~$284/month (MTF+Keltner)
# ═══════════════════════════════════════════════════════════════════════

account:
  initial_balance: 5000
  mode: "live"
  risk_per_trade_pct: 1.0          # ★ OPTIMAL for $5k (backtest matrix: 1% is sweet spot)
  max_lot_per_trade: 0.50
  min_lot_size: 0.01
  balance_adjustments: []

# ── Bot-level risk guard (TIGHTER than FundingPips so we pre-empt, not match) ──
# FP 1 Step Step 1 / Master enforces 3% daily / 6% overall. We trip at 2% / 4.5%
# so there's real headroom: 1% / 1.5% buffer before FP sees anything.
# Verified 2026-07-11 from help.fundingpips.com via Wayback Machine
# (articles: 8536000-forbidden-strategies, 8535998-news-holding, 10383543-questions).
risk:
  max_open_positions: 4
  max_positions_per_symbol: 3
  # Directional cap (matches schema.py max_positions_per_direction=2) — bot can't
  # stack more than 2 longs or 2 shorts on the same symbol.
  max_positions_per_direction: 2
  max_daily_trades: 50
  max_daily_loss_pct: 2.0          # FP=3% → 1% headroom
  max_drawdown_pct: 4.5            # FP=6% → 1.5% headroom
  min_rr_ratio: 1.5
  min_rr_ratio_scalping: 0.4

# ── FundingPips prop-firm rules (verified from public docs) ───────────────
prop_firm:
  enabled: true
  provider: "fundingpips"
  account_size: 5000
  phase: "step1"                   # Change: step1 → step2 → master (1 Step model)
  leverage_metals: 20              # FP: metals 1:20 (per /trading-objectives)
  commission_per_lot_metals: 5.0
  daily_loss_limit_pct: 3.0        # FP 1 Step Step 1 = 3% (was 5%, drift fixed)
  max_overall_dd_pct: 6.0          # FP 1 Step Step 1 = 6% (was 10%, drift fixed)
  safety_buffer_daily_pct: 1.0     # 1% under FP's daily = bot trips here
  safety_buffer_dd_pct: 1.5        # 1.5% under FP's overall = bot trips here
  safety_buffer_daily_usd: 50      # $5K × 1% = $50 effective daily buffer
  safety_buffer_dd_usd: 75         # $5K × 1.5% = $75 effective overall buffer
  profit_target_pct: 10.0          # Step1=10.0, Master=0 (1 Step model: single step)
  max_risk_per_trade_pct: 3.0      # FP Master: <$50K = 3% max; our 1% is well within
  friday_auto_close: true          # Operational: avoid weekend gap risk
  friday_close_hour_utc: 21
  news_filter_enabled: true        # Required on Master; defensive on Step 1
  pre_news_flat_minutes: 5         # FP Master: 5 min before high-impact (red folder)
  pre_news_lookback_hours: 5       # Trades opened 5h before news are EXCLUDED from 10-min window
  max_directional_positions: 2     # Matches risk.max_positions_per_direction
  min_trading_days: 3
  inactivity_limit_days: 30

# ── EA policy self-attestation ────────────────────────────────────────────
# Per FP help article "What are the Forbidden Strategies?" (Wayback 2026-02-10):
# "Using a third-party Expert Advisor (EA) is allowed as long as it is a trade
#  or risk manager." This bot is a first-party EA acting as trade + risk
# manager (PropFirmGuard, TrailingStopManager, PositionMonitor, EmergencyStop).
# All entry strategies (m5_mtf_momentum, m5_keltner_squeeze, m5_dual_supertrend,
# ema_pullback, london_breakout, m30_rsi2_mean_reversion) are first-party.
# NOT used: HFT, latency arbitrage, tick scalping, hedging, copy-trading
# between different users, third-party signal EAs, gap trading.

strategies:
  scalping:
    risk_per_trade_pct: 1.0
    profit_growth_factor: 0.50
    max_total_open_positions: 4
    daily_loss_limit_pct: 4.0
    instruments: [XAUUSD]
    strategies_enabled:
      - m5_mtf_momentum            # ✓ +31.7%, R:R 1:1.95, WR 41%
      - m5_keltner_squeeze         # ✓ +74.7%, R:R 1:4.00, WR 23%
      - m5_dual_supertrend         # ✓ profitable at 1% (not at 2%)
  ema_pullback:
    enabled: true
    fast_ema: 8
    slow_ema: 21
    trend_ema: 50
    pullback_max_candles: 5
    entry_window_candles: 2
    atr_sl_multiplier: 3.5
    atr_tp_multiplier: 10.0
    entry_timeframe: "M15"
    regime_timeframe: "H1"
  london_breakout:
    enabled: true
    asian_start_hour: 0
    asian_end_hour: 7
    breakout_buffer_pips: 3.0
    max_trades_per_day: 2
    tp_multiplier: 5.0
    timeframe: "M15"

claude_filter:
  enabled: false                   # Disabled — strategies use own confidence

signal_generator:
  instruments: [XAUUSD, XAGUSD, BTCUSD, ETHUSD]
  instrument_overrides: {}
  allowed_sessions:
    - london
    - new_york
    - london_ny_overlap
    - asian_london_overlap
